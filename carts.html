
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
</head>
<body>

    <h1>Shopping Cart</h1>

    <table border="1" cellpadding="10" cellspacing="0">
        <tr>
            <th>Product</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Total</th>
            <th>Action</th>
        </tr>

        <tr>
            <td>Mobile Phone</td>
            <td>₹15,000</td>
            <td>
                <input type="number" value="1" min="1">
            </td>
            <td>₹15,000</td>
            <td>
                <button>Remove</button>
            </td>
        </tr>

        <tr>
            <td>Laptop</td>
            <td>₹45,000</td>
            <td>
                <input type="number" value="1" min="1">
            </td>
            <td>₹45,000</td>
            <td>
                <button>Remove</button>
            </td>
        </tr>

        <tr>
            <td>Headphones</td>
            <td>₹2,000</td>
            <td>
                <input type="number" value="2" min="1">
            </td>
            <td>₹4,000</td>
            <td>
                <button>Remove</button>
            </td>
        </tr>
    </table>

    <h2>Cart Summary</h2>

    <p>Subtotal: ₹64,000</p>
    <p>Shipping: ₹100</p>
    <h3>Grand Total: ₹64,100</h3>

    <button>Continue Shopping</button>
    <button>Proceed to Checkout</button>

</body>
</html>
